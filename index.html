<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Oxgoose Radio</title>
<style>
  :root{
    --bg:#05040a;
    --stroke: rgba(255,255,255,.10);
    --shadow: 0 24px 90px rgba(0,0,0,.65);
    --radius: 18px;
    --panel-bg: rgba(7,8,18,.72);
    --panel-border: rgba(255,255,255,.12);
    --text: #e9e9f2;
    --muted: rgba(233,233,242,.72);
    --green: #39ff14;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 50% 35%, rgba(255,75,214,.12), transparent 60%),
      radial-gradient(1000px 700px at 55% 45%, rgba(108,123,255,.14), transparent 62%),
      radial-gradient(1200px 900px at 50% 50%, rgba(70,255,149,.08), transparent 60%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  #app{
    width:min(96vw, 1120px);
    display:grid;
    grid-template-columns:minmax(320px, 1fr) clamp(260px, 28vw, 320px);
    gap:18px;
    align-items:start;
  }

  .panel{
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .leftCol{
    display:flex;
    flex-direction:column;
    gap:16px;
    min-width:0;
  }

  #stage{
    position:relative;
    width:min(100%, calc((100vh - 230px) * 0.75));
    max-width:820px;
    aspect-ratio: 3 / 4;
    border-radius: var(--radius);
    overflow:hidden;
    border:1px solid var(--stroke);
    background:#0b0712;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    margin:0 auto;
  }

  #bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(1.05) contrast(1.03);
    transform: translateZ(0);
  }

  #vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 30%, rgba(0,0,0,0), rgba(0,0,0,.35) 62%, rgba(0,0,0,.72) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.06), rgba(0,0,0,.55));
    pointer-events:none;
  }

  #overlay{
    position:absolute; inset:0;
    pointer-events:auto;
  }
  .hotspot{
    position:absolute;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    letter-spacing: .08em;
    font-size: 12px;
    text-transform: uppercase;
    color: rgba(255,255,255,.65);
    cursor:pointer;
    transition: transform .08s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .hotspot:active{ transform: scale(.98); }
  .hotspot:hover{
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.18);
    color: rgba(255,255,255,.82);
  }

  #signText{
    position:absolute;
    left:50%;
    top: 68.35%;
    transform: translateX(-50%);
    width: 55.2%;
    height: 10.9%;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
    z-index: 3;
  }
  #signText::before{
    content:"";
    position:absolute;
    inset: 0;
    border-radius: 3px;
    background: #04070a;
    box-shadow: inset 0 0 0 1px rgba(80,220,255,.22);
  }

  .signClip{
    position:relative;
    width: 96%;
    overflow:hidden;
    white-space:nowrap;
    text-align:center;
  }

  .signInner{
    display:inline-block;
    font-family: Impact, "Arial Black", system-ui, sans-serif;
    font-size: clamp(11px, 1.15vw, 18px);
    line-height:1;
    letter-spacing: .35px;
    color: var(--green);
    text-transform: uppercase;
    text-shadow:
      0 0 4px rgba(57,255,20,.72),
      0 0 10px rgba(57,255,20,.42),
      0 0 18px rgba(26,255,0,.22);
    padding: 0 6px;
    will-change: transform;
  }

  .marquee .signInner{
    display:inline-block;
    font-family: Impact, "Arial Black", system-ui, sans-serif;
    font-size: clamp(11px, 1.15vw, 18px);
    line-height:1;
    letter-spacing: .35px;
    color: var(--green);
    text-transform: uppercase;
    text-shadow:
      0 0 4px rgba(57,255,20,.72),
      0 0 10px rgba(57,255,20,.42),
      0 0 18px rgba(26,255,0,.22);
    padding: 0 6px;
    will-change: transform;
  }
  @keyframes marquee{
    0%   { transform: translateX(0); }
    100% { transform: translateX(var(--marquee-distance, -120%)); }
  }

  .controls{
    padding:16px;
    width:min(100%, 820px);
    margin:0 auto;
  }

  .nowPlaying{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }
  .trackTitle{
    font-weight:800;
    letter-spacing:.03em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .shuffleState{
    flex:0 0 auto;
    font-size:12px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .shuffleState.on{ color:var(--green); }

  .transport{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }

  button.ctrl{
    appearance:none;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);
    color:var(--text);
    border-radius:12px;
    padding:10px 14px;
    font-weight:800;
    letter-spacing:.06em;
    cursor:pointer;
    transition:transform .08s ease, background .2s ease, border-color .2s ease;
  }
  button.ctrl:hover{
    background:rgba(255,255,255,.10);
    border-color:rgba(255,255,255,.24);
  }
  button.ctrl:active{ transform:scale(.98); }
  button.ctrl.active{
    border-color:rgba(57,255,20,.45);
    box-shadow:0 0 0 1px rgba(57,255,20,.12) inset;
    color:var(--green);
  }

  .progressRow{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }

  .time{
    font-variant-numeric: tabular-nums;
    color:var(--muted);
    font-size:13px;
    min-width:42px;
    text-align:center;
  }

  input[type="range"]{
    width:100%;
    accent-color: var(--green);
    cursor:pointer;
  }

  .volumeRow{
    display:grid;
    grid-template-columns:auto minmax(120px, 240px) auto;
    gap:10px;
    align-items:center;
  }
  .label{
    font-size:12px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  #volumeValue{
    min-width:48px;
    text-align:right;
    color:var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .playlist{
    padding:14px;
    min-height:220px;
    max-height:min(calc(100vh - 44px), 780px);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .playlistHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .playlistHeader h2{
    margin:0;
    font-size:16px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .playlistMeta{
    font-size:12px;
    color:var(--muted);
  }
  #trackList{
    list-style:none;
    margin:0;
    padding:0;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .trackItem{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:10px;
    align-items:center;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.04);
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, transform .08s ease;
  }
  .trackItem:hover{
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.18);
  }
  .trackItem:active{ transform:scale(.99); }
  .trackItem.active{
    border-color:rgba(57,255,20,.45);
    background:rgba(57,255,20,.08);
    box-shadow:0 0 0 1px rgba(57,255,20,.10) inset;
  }
  .trackItem.played{
    background:rgba(255,255,255,.025);
    border-color:rgba(255,255,255,.08);
  }
  .trackItem.played .trackNum,
  .trackItem.played .trackName{
    color:rgba(233,233,242,.42);
  }
  .trackItem.active .trackNum,
  .trackItem.active .trackName{
    color:var(--text);
  }
  .trackNum{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    min-width:22px;
    text-align:right;
  }
  .trackName{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:700;
  }

  audio{ display:none; }

  @media (max-width: 980px){
    body{
      align-items:flex-start;
    }
    #app{
      grid-template-columns:1fr;
      width:min(96vw, 820px);
    }
    #stage, .controls{
      width:100%;
      max-width:none;
    }
    .playlist{
      max-height:360px;
    }
  }

  @media (max-height: 900px){
    #stage{
      width:min(100%, calc((100vh - 210px) * 0.75));
    }
  }
</style>
</head>
<body>
<div id="app">
  <div class="leftCol">
    <div id="stage" class="panel" aria-label="Oxgoose Radio Player">
      <img id="bg" alt="Scarlett UI" src="scarlett-ui.jpg" />
      <div id="overlay"></div>

      <div id="signText" aria-hidden="true">
        <div class="signClip" id="signClip">
          <span class="signInner" id="signInner">Loading…</span>
        </div>
      </div>

      <div id="vignette"></div>
    </div>

    <section class="controls panel" aria-label="Playback controls">
      <div class="nowPlaying">
        <div class="trackTitle" id="trackTitle">Loading…</div>
        <div class="shuffleState on" id="shuffleState">Shuffle On</div>
      </div>

      <div class="transport">
        <button class="ctrl" id="prevBtn" type="button">Prev</button>
        <button class="ctrl" id="playBtn" type="button">Play</button>
        <button class="ctrl" id="pauseBtn" type="button">Pause</button>
        <button class="ctrl" id="nextBtn" type="button">Next</button>
        <button class="ctrl active" id="shuffleBtn" type="button">Shuffle</button>
      </div>

      <div class="progressRow">
        <div class="time" id="currentTime">0:00</div>
        <input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Track progress" />
        <div class="time" id="duration">0:00</div>
      </div>

      <div class="volumeRow">
        <div class="label">Volume</div>
        <input id="volume" type="range" min="0" max="100" value="100" step="1" aria-label="Volume" />
        <div id="volumeValue">100%</div>
      </div>
    </section>
  </div>

  <aside class="playlist panel" aria-label="Playlist">
    <div class="playlistHeader">
      <h2>Track List</h2>
      <div class="playlistMeta" id="playlistMeta">0 tracks</div>
    </div>
    <ol id="trackList"></ol>
  </aside>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  const OWNER  = "OxgooseRadio";
  const REPO   = "Oxgoose-Radio";
  const BRANCH = "main";
  const MP3_PATH = "";

  const stage        = document.getElementById("stage");
  const overlay      = document.getElementById("overlay");
  const audio        = document.getElementById("audio");
  const signClip     = document.getElementById("signClip");
  const signInner    = document.getElementById("signInner");
  const trackTitle   = document.getElementById("trackTitle");
  const shuffleState = document.getElementById("shuffleState");
  const trackList    = document.getElementById("trackList");
  const playlistMeta = document.getElementById("playlistMeta");
  const progress     = document.getElementById("progress");
  const currentTime  = document.getElementById("currentTime");
  const duration     = document.getElementById("duration");
  const volume       = document.getElementById("volume");
  const volumeValue  = document.getElementById("volumeValue");
  const playBtn      = document.getElementById("playBtn");
  const pauseBtn     = document.getElementById("pauseBtn");
  const prevBtn      = document.getElementById("prevBtn");
  const nextBtn      = document.getElementById("nextBtn");
  const shuffleBtn   = document.getElementById("shuffleBtn");

  const LS_KEY = "oxgoose_hotspots_v4";
  const VOL_KEY = "oxgoose_volume_v1";
  const DEFAULT_HOTSPOTS = [
    { id:"play",    label:"PLAY",    x:18.0, y:44.8, w:10.2, h:4.9 },
    { id:"prev",    label:"PREV",    x:29.8, y:44.8, w:10.2, h:4.9 },
    { id:"pause",   label:"PAUSE",   x:41.7, y:44.8, w:11.2, h:4.9 },
    { id:"next",    label:"NEXT",    x:54.9, y:44.8, w:10.2, h:4.9 },
    { id:"shuffle", label:"SHUFFLE", x:66.8, y:44.8, w:12.4, h:4.9 },
  ];

  let tracks = [];
  let currentIndex = 0;
  let shuffleOn = true;
  let shuffleQueue = [];
  let history = [];
  let suppressHistoryPush = false;
  let isSeeking = false;
  const playedIndices = new Set();

  function cleanName(name){
    return String(name || "").replace(/\.mp3$/i,"");
  }

  function formatTime(seconds){
    if (!isFinite(seconds) || seconds < 0) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${String(secs).padStart(2, "0")}`;
  }

  function loadHotspots(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return DEFAULT_HOTSPOTS.map(h => ({...h}));
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || !parsed.length) return DEFAULT_HOTSPOTS.map(h => ({...h}));
      return parsed.map(h => ({
        id: h.id,
        label: h.label ?? (h.id || "").toUpperCase(),
        x: +h.x, y:+h.y, w:+h.w, h:+h.h
      })).filter(h => h.id && isFinite(h.x) && isFinite(h.y) && isFinite(h.w) && isFinite(h.h));
    }catch{
      return DEFAULT_HOTSPOTS.map(h => ({...h}));
    }
  }

  function pctToPxRect(h){
    const r = stage.getBoundingClientRect();
    return {
      left: (h.x/100)*r.width,
      top:  (h.y/100)*r.height,
      width:(h.w/100)*r.width,
      height:(h.h/100)*r.height
    };
  }

  let hotspotNodes = new Map();
  function buildHotspots(){
    overlay.innerHTML = "";
    hotspotNodes.clear();
    for (const h of loadHotspots()){
      const el = document.createElement("div");
      el.className = "hotspot";
      el.dataset.id = h.id;
      el.textContent = h.label || h.id.toUpperCase();
      overlay.appendChild(el);
      hotspotNodes.set(h.id, { data:h, el });
    }
    positionHotspots();
  }

  function positionHotspots(){
    for (const {data, el} of hotspotNodes.values()){
      const r = pctToPxRect(data);
      el.style.left = r.left + "px";
      el.style.top = r.top + "px";
      el.style.width = r.width + "px";
      el.style.height = r.height + "px";
    }
  }
  window.addEventListener("resize", positionHotspots);

  function setSignTitle(text){
    signInner.textContent = text || "";
    signClip.classList.remove("marquee");
    requestAnimationFrame(() => {
      const clipW = signClip.clientWidth;
      const textW = signInner.scrollWidth;
      if (textW > clipW + 8){
        const distancePx = textW + clipW;
        const speed = 90;
        const durationSec = Math.max(10, Math.min(40, distancePx / speed));
        signClip.style.setProperty("--marquee-distance", (-distancePx) + "px");
        signClip.style.setProperty("--marquee-duration", durationSec + "s");
        signClip.classList.add("marquee");
      }
    });
  }

  function updatePlaylistUI(){
    const nodes = trackList.querySelectorAll(".trackItem");
    nodes.forEach((node, i) => {
      const isActive = i === currentIndex;
      node.classList.toggle("active", isActive);
      node.classList.toggle("played", playedIndices.has(i) && !isActive);
    });
    const activeNode = trackList.querySelector(`.trackItem[data-index="${currentIndex}"]`);
    if (activeNode){
      activeNode.scrollIntoView({ block:"nearest", inline:"nearest" });
    }
    const t = tracks[currentIndex];
    const name = t ? cleanName(t.name) : "Loading…";
    setSignTitle(name);
    trackTitle.textContent = name;
  }

  function updateShuffleUI(){
    shuffleBtn.classList.toggle("active", shuffleOn);
    shuffleState.textContent = shuffleOn ? "Shuffle On" : "Shuffle Off";
    shuffleState.classList.toggle("on", shuffleOn);
  }

  function setTrackIndex(i, opts = {}){
    if (!tracks.length) return;
    const nextIndex = (i + tracks.length) % tracks.length;
    if (!opts.silentHistory && !suppressHistoryPush && nextIndex !== currentIndex){
      history.push(currentIndex);
    }
    currentIndex = nextIndex;
    playedIndices.add(currentIndex);
    audio.src = tracks[currentIndex].url;
    audio.load();
    progress.value = 0;
    currentTime.textContent = "0:00";
    duration.textContent = "0:00";
    updatePlaylistUI();
  }

  function refillShuffleQueue(){
    if (!tracks.length) return;
    shuffleQueue = tracks.map((_, i) => i).filter(i => i !== currentIndex);
    for (let i = shuffleQueue.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleQueue[i], shuffleQueue[j]] = [shuffleQueue[j], shuffleQueue[i]];
    }
  }

  function getNextShuffleIndex(){
    if (!tracks.length) return 0;
    if (tracks.length === 1) return 0;
    if (!shuffleQueue.length) refillShuffleQueue();
    let next = shuffleQueue.shift();
    if (next == null || next === currentIndex){
      refillShuffleQueue();
      next = shuffleQueue.shift();
    }
    return (next == null ? currentIndex : next);
  }

  async function playCurrent(){
    if (!tracks.length) return;
    try{ await audio.play(); }catch{}
  }

  function nextTrack(opts = {}){
    if (!tracks.length) return;
    const shouldPlay = !!opts.forcePlay || !audio.paused;
    const nextIndex = shuffleOn ? getNextShuffleIndex() : (currentIndex + 1) % tracks.length;
    setTrackIndex(nextIndex, { silentHistory: !!opts.silentHistory });
    if (shouldPlay) playCurrent();
  }

  function previousTrack(){
    if (!tracks.length) return;
    const shouldPlay = !audio.paused;

    if (audio.currentTime > 3){
      audio.currentTime = 0;
      return;
    }

    let prevIndex;
    if (history.length){
      suppressHistoryPush = true;
      prevIndex = history.pop();
      setTrackIndex(prevIndex, { silentHistory:true });
      suppressHistoryPush = false;
    }else{
      prevIndex = shuffleOn ? currentIndex : (currentIndex - 1 + tracks.length) % tracks.length;
      setTrackIndex(prevIndex, { silentHistory:true });
    }

    if (shouldPlay) playCurrent();
  }

  function toggleShuffle(){
    shuffleOn = !shuffleOn;
    if (shuffleOn) refillShuffleQueue();
    updateShuffleUI();
  }

  function renderTrackList(){
    trackList.innerHTML = "";
    tracks.forEach((track, index) => {
      const li = document.createElement("li");
      li.className = "trackItem" + (index === currentIndex ? " active" : "") + (playedIndices.has(index) && index !== currentIndex ? " played" : "");
      li.dataset.index = String(index);
      li.innerHTML = `
        <div class="trackNum">${index + 1}</div>
        <div class="trackName">${cleanName(track.name)}</div>
      `;
      li.addEventListener("click", () => {
        const shouldPlay = !audio.paused;
        setTrackIndex(index);
        if (shuffleOn) refillShuffleQueue();
        if (shouldPlay) playCurrent();
      });
      trackList.appendChild(li);
    });
    playlistMeta.textContent = `${tracks.length} track${tracks.length === 1 ? "" : "s"}`;
  }

  function syncProgress(){
    if (isSeeking) return;
    const dur = isFinite(audio.duration) ? audio.duration : 0;
    const cur = isFinite(audio.currentTime) ? audio.currentTime : 0;
    currentTime.textContent = formatTime(cur);
    duration.textContent = formatTime(dur);
    progress.value = dur > 0 ? Math.round((cur / dur) * 1000) : 0;
  }

  function setVolume(v){
    const normalized = Math.max(0, Math.min(1, v));
    audio.volume = normalized;
    volume.value = String(Math.round(normalized * 100));
    volumeValue.textContent = `${Math.round(normalized * 100)}%`;
    localStorage.setItem(VOL_KEY, String(normalized));
  }

  async function fetchTracks(){
    const pathPart = MP3_PATH ? `/${encodeURIComponent(MP3_PATH)}` : "";
    const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents${pathPart}?ref=${encodeURIComponent(BRANCH)}`;
    const r = await fetch(api, { headers: { "Accept": "application/vnd.github+json" } });
    if (!r.ok) throw new Error(`GitHub API ${r.status}`);
    const data = await r.json();
    return (Array.isArray(data) ? data : [])
      .filter(x => x && x.type === "file" && /\.mp3$/i.test(x.name))
      .map(x => ({ name: x.name, url: x.download_url }))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:"base" }));
  }

  function bindControls(){
    overlay.addEventListener("click", (e) => {
      const el = e.target.closest(".hotspot");
      if (!el) return;
      const id = el.dataset.id;
      if (id === "play") playCurrent();
      else if (id === "pause") audio.pause();
      else if (id === "prev") previousTrack();
      else if (id === "next") nextTrack();
      else if (id === "shuffle") toggleShuffle();
    });

    playBtn.addEventListener("click", playCurrent);
    pauseBtn.addEventListener("click", () => audio.pause());
    prevBtn.addEventListener("click", previousTrack);
    nextBtn.addEventListener("click", () => nextTrack());
    shuffleBtn.addEventListener("click", toggleShuffle);

    progress.addEventListener("input", () => {
      isSeeking = true;
      const dur = isFinite(audio.duration) ? audio.duration : 0;
      const preview = dur * (Number(progress.value) / 1000);
      currentTime.textContent = formatTime(preview);
      duration.textContent = formatTime(dur);
    });

    progress.addEventListener("change", () => {
      const dur = isFinite(audio.duration) ? audio.duration : 0;
      if (dur > 0){
        audio.currentTime = dur * (Number(progress.value) / 1000);
      }
      isSeeking = false;
      syncProgress();
    });

    volume.addEventListener("input", () => setVolume(Number(volume.value) / 100));

    audio.addEventListener("timeupdate", syncProgress);
    audio.addEventListener("loadedmetadata", syncProgress);
    audio.addEventListener("durationchange", syncProgress);
    audio.addEventListener("ended", () => nextTrack({ forcePlay:true }));
  }

  async function init(){
    buildHotspots();
    bindControls();

    const savedVolumeRaw = localStorage.getItem(VOL_KEY);
    const savedVolume = savedVolumeRaw === null ? NaN : Number(savedVolumeRaw);
    setVolume(Number.isFinite(savedVolume) ? savedVolume : 1);
    updateShuffleUI();

    try{
      tracks = await fetchTracks();
      if (!tracks.length){
        setSignTitle("No MP3s found");
        trackTitle.textContent = "No MP3s found";
        playlistMeta.textContent = "0 tracks";
        return;
      }
      currentIndex = 0;
      setTrackIndex(0, { silentHistory:true });
      renderTrackList();
      refillShuffleQueue();
      updatePlaylistUI();
    }catch(err){
      console.error(err);
      setSignTitle("Error loading MP3s");
      trackTitle.textContent = "Error loading MP3s";
    }
  }

  init();
})();
</script>
</body>
</html>
